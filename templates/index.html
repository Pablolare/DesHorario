<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesHorario – Gestión de registros de horas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">
    <h1>DesHorario</h1>
    <p>Introduce tu token de API de OpenProject para gestionar los registros de horas.</p>

    {% if error %}
        <p class="alerta error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('index') }}" method="POST">
        <label for="token">Token API</label>
        <input type="password" id="token" name="token"
               placeholder="Tu token de OpenProject" required autofocus>
        <button type="submit">Conectar</button>
    </form>
</div>

</body>
</html>
